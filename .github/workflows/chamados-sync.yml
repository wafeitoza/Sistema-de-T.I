# Fase extra — sincronização automática dos chamados por e-mail
#
# Por que o GitHub Actions e não o Vercel Cron: o plano free da Vercel só
# roda cron 1x/dia, e o repo é público — Actions agendado é gratuito e sem
# limite de execuções. A cada 5 minutos o job chama a Function
# /api/cron-sincronizar, que faz a mesma importação do botão "Sincronizar
# agora" e converte e-mail da caixa conectada em chamado.
#
# Secret exigido (repo → Settings → Secrets and variables → Actions):
#   CRON_SECRET  mesmo valor da env var CRON_SECRET na Vercel — sem ela (ou
#                com valor diferente) a Function recusa com 401.
#
# Aviso: workflows agendados de repo público são desativados após 60 dias
# sem commits; um push (ou "Re-run jobs" na aba Actions) reativa.
name: Sincroniza chamados do Gmail

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # gatilho manual para teste

permissions:
  contents: read

# nunca duas sincronizações simultâneas (a dedupe do banco seguraria, mas
# para de gastar cota de API do Gmail à toa)
concurrency:
  group: sincroniza-chamados
  cancel-in-progress: false

jobs:
  sincronizar:
    name: importa e-mails novos
    runs-on: ubuntu-latest
    steps:
      - name: Dispara a sincronização na Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          status=$(curl -sS -o resposta.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://it-stock-react.vercel.app/api/cron-sincronizar)
          cat resposta.json; echo

          # "origem":"cron" só entra no corpo quando a Function aceitou o
          # segredo e executou. Sem ele, o 401 é de segredo errado/ausente —
          # falha visível aqui, para corrigir o secret.
          if grep -q '"origem":"cron"' resposta.json; then
            echo "HTTP $status — sincronização processada"
          else
            echo "HTTP $status — a Function recusou (CRON_SECRET divergente na Vercel?)"
            exit 1
          fi
